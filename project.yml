name: RatuKidulIDE
options:
  bundleIdPrefix: sh.ratukidul
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en

packages:
  CodeEditSourceEditor:
    url: https://github.com/CodeEditApp/CodeEditSourceEditor
    from: "0.15.0"
  CodeEditLanguages:
    url: https://github.com/CodeEditApp/CodeEditLanguages
    from: "0.1.20"
  SwiftMarkdown:
    url: https://github.com/swiftlang/swift-markdown
    from: "0.7.3"

targets:
  RatuKidulIDE:
    type: application
    platform: macOS
    sources:
      - path: RatuKidulIDE
    dependencies:
      - package: CodeEditSourceEditor
        product: CodeEditSourceEditor
      - package: CodeEditLanguages
        product: CodeEditLanguages
      - package: SwiftMarkdown
        product: Markdown
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: sh.ratukidul.ide
      PRODUCT_NAME: Ratu Kidul IDE
      SWIFT_VERSION: "5.9"
      MACOSX_DEPLOYMENT_TARGET: "26.0"
      INFOPLIST_FILE: RatuKidulIDE/Resources/Info.plist
      CODE_SIGN_ENTITLEMENTS: RatuKidulIDE/Resources/RatuKidulIDE.entitlements
      CODE_SIGN_IDENTITY: ""
      CODE_SIGN_STYLE: Manual
      DEVELOPMENT_TEAM: ""
      ENABLE_HARDENED_RUNTIME: false
      CODE_SIGNING_ALLOWED: false
    info:
      path: RatuKidulIDE/Resources/Info.plist
      properties:
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: "Copyright © 2025"

  RatuKidulIDETests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: RatuKidulIDETests
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: sh.ratukidul.ide.tests
      SWIFT_VERSION: "5.9"
    dependencies:
      - target: RatuKidulIDE

